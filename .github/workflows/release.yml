name: Release

# One tag, one release, both apps. Pushing vX.Y.Z (or vX.Y.Z-beta.N, -alpha.N, -rc.N) builds the
# Mac app and the Windows app from the same commit, in parallel, and only when both have
# succeeded publishes them together as one GitHub release:
#
#   mac       build, sign, notarize; the DMG for people, the ZIP and appcast.xml for Sparkle
#   windows   test, build, sign with Azure Artifact Signing; installers and portable zips
#   publish   checks both sets against their checksums, creates the release as a draft with
#             every file, then publishes it — so nobody, Sparkle included, ever sees a release
#             with only half its files — and bumps the Homebrew tap for a stable release
#
# If one platform fails, nothing is published; fix it and use "Re-run failed jobs". The
# release notes are RELEASE_NOTES.md, covering both apps.
#
# The Mac's Sparkle feed is releases/latest/download/appcast.xml, so a stable release must be
# "latest", which a joint release always is. The Windows updater reads these releases too
# (UpdateLookup), recognising them by their Windows files.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      prerelease: ${{ steps.read.outputs.prerelease }}
    steps:
      - name: Read the version from the tag
        id: read
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Three numbers, because the Windows build stamps them into its executables, and an
          # optional -alpha.N / -beta.N / -rc.N, which both updaters order correctly.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Tag must be vX.Y.Z or vX.Y.Z-beta.N (or -alpha.N, -rc.N), got $GITHUB_REF_NAME"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A pre-release is not promoted to "latest" — Sparkle's feed stays on the last
          # stable release — and the Homebrew tap is left alone, so brew keeps installing the
          # previous stable build until the bare-version tag is pushed.
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Tag $GITHUB_REF_NAME -> $VERSION, prerelease"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Tag $GITHUB_REF_NAME -> $VERSION, stable"
          fi

  mac:
    needs: version
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout
        # Full history: the build number below is the commit count, and
        # Sparkle decides "is this newer" by comparing CFBundleVersion. A
        # shallow clone counts 1 for every release, so no installed copy
        # would ever be offered an update.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Stamp version and build number
        run: |
          BUILD="$(git rev-list --count HEAD)"
          PLIST=FileFluss/Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST"
          echo "Version $APP_VERSION, build $BUILD"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$CERTIFICATE_P12" | base64 -d > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          # The Release entitlements pin keychain-access-groups, which only
          # resolves through a real Developer ID provisioning profile —
          # CODE_SIGN_STYLE=Manual + DEVELOPMENT_TEAM alone isn't enough
          # because Xcode refuses to claim restricted entitlements without
          # a profile listing them.
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/profile.provisionprofile"

          # Extract the profile UUID and name so we can pass them to xcodebuild.
          PROFILE_PLIST=$(security cms -D -i "$RUNNER_TEMP/profile.provisionprofile")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$PROFILE_PLIST")
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          # Xcode looks up profiles by UUID under this directory.
          cp "$RUNNER_TEMP/profile.provisionprofile" "$PROFILE_DIR/$PROFILE_UUID.provisionprofile"

      - name: Build archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project FileFluss.xcodeproj \
            -scheme FileFluss \
            -destination 'generic/platform=macOS' \
            -archivePath $RUNNER_TEMP/FileFluss.xcarchive \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID"
          # NB: PROVISIONING_PROFILE_SPECIFIER is intentionally NOT passed here.
          # As a global setting it leaks onto the SwiftPM resource-bundle target
          # (which rejects profiles and fails the archive). It's scoped to the
          # FileFluss app target's Release config in project.yml instead; the
          # profile is installed by UUID above so the name resolves.

      - name: Export app
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Developer ID Application</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.rana-gmbh.FileFluss</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/FileFluss.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          APP_PATH="$RUNNER_TEMP/export/FileFluss.app"
          DMG_PATH="$RUNNER_TEMP/FileFluss-${GITHUB_REF_NAME}.dmg"
          BG_PATH="$RUNNER_TEMP/dmg-background.png"
          STAGE_DIR="$RUNNER_TEMP/dmg-stage"

          # Generate a simple background image with drag-to-Applications text.
          cat > "$RUNNER_TEMP/make-dmg-bg.swift" << 'SWIFT'
          import AppKit
          let width = 660, height = 400
          guard let rep = NSBitmapImageRep(
              bitmapDataPlanes: nil,
              pixelsWide: width,
              pixelsHigh: height,
              bitsPerSample: 8,
              samplesPerPixel: 4,
              hasAlpha: true,
              isPlanar: false,
              colorSpaceName: .deviceRGB,
              bytesPerRow: 0,
              bitsPerPixel: 0
          ) else { exit(1) }
          rep.size = NSSize(width: width, height: height)
          NSGraphicsContext.saveGraphicsState()
          NSGraphicsContext.current = NSGraphicsContext(bitmapImageRep: rep)
          NSColor.white.setFill()
          NSRect(x: 0, y: 0, width: width, height: height).fill()
          let text = "Please drag the FileFluss icon into the Applications folder"
          let para = NSMutableParagraphStyle()
          para.alignment = .center
          let attrs: [NSAttributedString.Key: Any] = [
              .font: NSFont.systemFont(ofSize: 16, weight: .medium),
              .foregroundColor: NSColor(calibratedWhite: 0.2, alpha: 1),
              .paragraphStyle: para,
          ]
          (text as NSString).draw(
              in: NSRect(x: 20, y: height - 60, width: width - 40, height: 40),
              withAttributes: attrs
          )
          NSGraphicsContext.restoreGraphicsState()
          guard let png = rep.representation(using: .png, properties: [:]) else { exit(1) }
          try png.write(to: URL(fileURLWithPath: CommandLine.arguments[1]))
          SWIFT
          swift "$RUNNER_TEMP/make-dmg-bg.swift" "$BG_PATH"

          # create-dmg needs a staging folder containing only the app.
          mkdir -p "$STAGE_DIR"
          cp -R "$APP_PATH" "$STAGE_DIR/"

          create-dmg \
            --volname "FileFluss" \
            --background "$BG_PATH" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 100 \
            --icon "FileFluss.app" 165 220 \
            --hide-extension "FileFluss.app" \
            --app-drop-link 495 220 \
            --no-internet-enable \
            "$DMG_PATH" \
            "$STAGE_DIR"

          echo "DMG_PATH=$DMG_PATH" >> $GITHUB_ENV

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait

          xcrun stapler staple "$DMG_PATH"

      - name: Zip the notarized app for Sparkle
        # Sparkle updates from a ZIP of the .app. It is built from the same
        # exported bundle as the DMG, after stapling, so the archive users
        # receive as an update carries the notarization ticket too.
        run: |
          APP_PATH="$RUNNER_TEMP/export/FileFluss.app"
          xcrun stapler staple "$APP_PATH"
          ZIP_PATH="$RUNNER_TEMP/FileFluss-${APP_VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"
          echo "ZIP_PATH=$ZIP_PATH" >> $GITHUB_ENV

          # A missing framework means the update would crash at launch on the
          # user's machine, which is the worst possible moment to find out.
          test -d "$APP_PATH/Contents/Frameworks/Sparkle.framework" \
            || { echo "::error::Sparkle.framework missing from the app bundle"; exit 1; }
          codesign --verify --deep --strict "$APP_PATH"

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY is not set — the appcast would be unsigned and every update rejected"
            exit 1
          fi

          # Sparkle's own tooling, pinned and checksummed. Must stay in step
          # with the framework version in project.yml.
          SPARKLE_VERSION=2.9.6
          SPARKLE_SHA256=52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "${SPARKLE_SHA256}  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle" ./bin/generate_appcast
          SPARKLE_BIN="$RUNNER_TEMP/sparkle/bin"

          WORK="$RUNNER_TEMP/appcast"
          mkdir -p "$WORK"
          cp "$ZIP_PATH" "$WORK/"

          # Release notes shown inside Sparkle's window: the same file the
          # GitHub release uses, rendered to HTML.
          gh api markdown -F text=@RELEASE_NOTES.md -f mode=gfm -f context="$GITHUB_REPOSITORY" \
            > "$WORK/FileFluss-${APP_VERSION}.html"

          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_BIN/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}/releases/latest" \
            --embed-release-notes \
            --maximum-deltas 0 \
            "$WORK"

          grep -q 'sparkle:edSignature' "$WORK/appcast.xml" \
            || { echo "::error::appcast.xml carries no EdDSA signature"; exit 1; }
          grep -q "releases/download/${GITHUB_REF_NAME}/FileFluss-${APP_VERSION}.zip" "$WORK/appcast.xml" \
            || { echo "::error::appcast.xml does not point at FileFluss-${APP_VERSION}.zip"; exit 1; }
          echo "APPCAST_PATH=$WORK/appcast.xml" >> $GITHUB_ENV

      - name: Hand the Mac files to the publish job
        run: |
          OUT="$RUNNER_TEMP/mac-release"
          mkdir -p "$OUT"
          cp "$DMG_PATH" "$ZIP_PATH" "$APPCAST_PATH" "$OUT/"
          # Hashed here, where the files were made, and checked again after the hand-over.
          (cd "$OUT" && shasum -a 256 * > "$RUNNER_TEMP/mac.sha256" && mv "$RUNNER_TEMP/mac.sha256" .)
          cat "$OUT/mac.sha256"
          echo "MAC_OUT=$OUT" >> $GITHUB_ENV

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac
          path: ${{ env.MAC_OUT }}
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    # The Azure app registration trusts this environment, not individual tags, so its
    # federated credential never has to change. The environment is restricted to the release
    # tags (Settings → Environments → windows-release: v*), so no branch can sign.
    environment: windows-release
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Code signing with Azure Artifact Signing, as Rana GmbH, once the variables
      # AZURE_CLIENT_ID and AZURE_TENANT_ID are set (identifiers, not secrets). Without them,
      # releases are built unsigned.
      HAS_AZURE_SIGNING: ${{ vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' }}
      SIGNING_ENDPOINT: https://neu.codesigning.azure.net/
      SIGNING_ACCOUNT: ranagmbh
      SIGNING_PROFILE: rana-public

    permissions:
      contents: read
      # Signing logs in to Azure with GitHub's OIDC token: no Azure secret is stored here.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Verify generated resources are current
        run: dotnet run --project windows/tools/StringsToResx --configuration Release -- --check

      - name: Test
        run: dotnet test windows/FileFluss.sln --configuration Release

      # Pinned: Inno Setup 7 is out, and an unpinned install would build the next release
      # with a compiler the .iss script has never been tested against. Raise it deliberately.
      - name: Install Inno Setup
        run: choco install innosetup --version 6.7.1 --allow-downgrade --no-progress -y

      # Code signing in two rounds, because an installer has to be built from executables that
      # are already signed: first FileFluss's own exe and DLLs, then the installers. Each round
      # signs the files gathered under windows/artifacts/sign in place and hands them on through
      # windows/artifacts/signed, where build-release.ps1 checks that each one carries a valid
      # signature before using it. Windows PowerShell 5.1, the shell the script is verified with.
      - name: Publish
        shell: powershell
        run: ./windows/Packaging/build-release.ps1 -Version $env:VERSION -Stage Publish

      # A login per round: the GitHub token behind it is short-lived, and packaging takes minutes.
      - name: Azure login for the executables
        if: env.HAS_AZURE_SIGNING == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # The app may only sign: it has a role on the signing account, none on the subscription.
          allow-no-subscriptions: true

      - name: Sign the executables
        if: env.HAS_AZURE_SIGNING == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ env.SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\windows\artifacts\sign\binaries
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: FileFluss
          description-url: https://github.com/rana-gmbh/FileFluss
          exclude-environment-credential: true
          exclude-azure-cli-credential: false

      - name: Hand on the signed executables
        if: env.HAS_AZURE_SIGNING == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows/artifacts/signed | Out-Null
          Copy-Item windows/artifacts/sign/binaries windows/artifacts/signed/binaries -Recurse -Force

      # -RequireInstaller: a release must never ship without its installers, which the in-app
      # updater depends on.
      - name: Package
        shell: powershell
        run: ./windows/Packaging/build-release.ps1 -Version $env:VERSION -Stage Package -RequireInstaller

      - name: Azure login for the installers
        if: env.HAS_AZURE_SIGNING == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Sign the installers
        if: env.HAS_AZURE_SIGNING == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ env.SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\windows\artifacts\sign\installers
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: FileFluss Setup
          description-url: https://github.com/rana-gmbh/FileFluss
          exclude-environment-credential: true
          exclude-azure-cli-credential: false

      - name: Hand on the signed installers
        if: env.HAS_AZURE_SIGNING == 'true'
        shell: pwsh
        run: Copy-Item windows/artifacts/sign/installers windows/artifacts/signed/installers -Recurse -Force

      - name: Checksums
        shell: powershell
        run: ./windows/Packaging/build-release.ps1 -Version $env:VERSION -Stage Checksums

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: windows/artifacts/release/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [version, mac, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        # For RELEASE_NOTES.md.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac
          path: dist/mac

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows
          path: dist/windows

      - name: Check and gather every file
        run: |
          set -euo pipefail
          # Each platform hashed its files where it made them. Checking those hashes here
          # catches anything that changed on the way, before it reaches a release.
          tr -d '\r' < dist/windows/SHA256SUMS.txt > dist/windows.sha256
          (cd dist/windows && sha256sum -c ../windows.sha256)
          (cd dist/mac && sha256sum -c mac.sha256)

          mkdir -p dist/release
          cp dist/mac/* dist/windows/* dist/release/
          rm dist/release/mac.sha256 dist/release/SHA256SUMS.txt

          # What Sparkle, the Windows updater and the Homebrew tap each look for by name.
          for file in "FileFluss-${GITHUB_REF_NAME}.dmg" "FileFluss-${VERSION}.zip" appcast.xml \
                      "FileFluss-Setup-${VERSION}-x64.exe" "FileFluss-Setup-${VERSION}-arm64.exe" \
                      "FileFluss-${VERSION}-x64-portable.zip" "FileFluss-${VERSION}-arm64-portable.zip"; do
            test -f "dist/release/$file" || { echo "::error::$file is missing"; exit 1; }
          done

          # One checksum list for the whole release. The Windows updater reads only its own
          # lines from it.
          cat dist/mac/mac.sha256 dist/windows.sha256 | sort -k2 > dist/release/SHA256SUMS.txt
          cat dist/release/SHA256SUMS.txt

      - name: Publish the release
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = true ]; then
            LATEST=--latest=false
            PRE=--prerelease
          else
            LATEST=--latest
            PRE=--prerelease=false
          fi

          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Created by hand before the tag was pushed: fill it in and keep its notes.
            gh release upload "$GITHUB_REF_NAME" dist/release/* --clobber
          else
            # A draft first, with every file, then published in one step.
            gh release create "$GITHUB_REF_NAME" dist/release/* \
              --draft --verify-tag \
              --title "FileFluss ${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false "$PRE" "$LATEST"

      - name: Update Homebrew tap cask
        if: needs.version.outputs.prerelease == 'false'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          SHA256=$(sha256sum "dist/release/FileFluss-${GITHUB_REF_NAME}.dmg" | awk '{print $1}')

          TAP_DIR="$RUNNER_TEMP/homebrew-filefluss"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/rana-gmbh/homebrew-filefluss.git" "$TAP_DIR"

          cd "$TAP_DIR"
          git config user.name "Robert Rudolph"
          git config user.email "robert.rudolph@mailbox.org"

          # GNU sed on this runner: -i takes no separate suffix argument, unlike macOS's.
          sed -i -E "s/^  version \".*\"/  version \"${VERSION}\"/" Casks/filefluss.rb
          sed -i -E "s/^  sha256 .*/  sha256 \"${SHA256}\"/" Casks/filefluss.rb

          if git diff --quiet Casks/filefluss.rb; then
            echo "Tap cask already up to date"
          else
