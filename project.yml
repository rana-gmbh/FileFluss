name: FileFluss
options:
  bundleIdPrefix: com.rana-gmbh
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  developmentLanguage: en
  # Localizations shipped in the app bundle. XcodeGen also picks regions up
  # from the .lproj folders under FileFluss/Resources/, but pinning them
  # keeps the project's knownRegions stable across regenerations.
  knownRegions:
    - en
    - de
    - zh-Hans
    - zh-Hant
    - Base

settings:
  base:
    SWIFT_VERSION: "6.3"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: true

packages:
  FileFlussCore:
    # Shared Foundation/SQLite/Security-only core consumed by both the
    # macOS app (this repo) and the iOS app (FileFluss Mobile, separate
    # repo). Lives at the workspace root so XcodeGen picks it up as a
    # local Swift package. Empty for now — file moves are landing
    # incrementally per follow-up commit.
    path: Packages/FileFlussCore

targets:
  FileFluss:
    type: application
    platform: macOS
    sources:
      - FileFluss
    dependencies:
      - package: FileFlussCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rana-gmbh.FileFluss
        PRODUCT_NAME: FileFluss
        INFOPLIST_FILE: FileFluss/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: true
        SWIFT_EMIT_LOC_STRINGS: true
        ENABLE_PREVIEWS: true
      configs:
        # Debug builds use ad-hoc signing where $(AppIdentifierPrefix)
        # can't resolve, so the slim variant omits keychain-access-groups.
        # Release builds sign with Developer ID + a team prefix and pick
        # up the full entitlements (including the keychain access group
        # required for the modern data-protection keychain).
        Debug:
          CODE_SIGN_ENTITLEMENTS: FileFluss/Resources/FileFluss.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: FileFluss/Resources/FileFluss.entitlements
          # Scope the Developer ID profile to the app target only. Passing it
          # as a global xcodebuild setting also applied it to the SwiftPM
          # resource-bundle target (FileFlussCore_FileFlussCore, created once
          # the package gained .lproj resources), which can't take a profile
          # and failed the archive. The CI installs this profile by UUID.
          PROVISIONING_PROFILE_SPECIFIER: "FileFluss Developer ID"
    # Entitlements live as hand-maintained plists on disk (Debug + Release
    # variants under FileFluss/Resources/). Don't add an `entitlements:`
    # block here — XcodeGen would overwrite the on-disk files at every
    # `xcodegen generate`.

  FileFlussTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - FileFlussTests
    dependencies:
      - target: FileFluss
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rana-gmbh.FileFlussTests
        GENERATE_INFOPLIST_FILE: true
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FileFluss.app/Contents/MacOS/FileFluss
